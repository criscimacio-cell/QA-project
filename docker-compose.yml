version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qtamp
      POSTGRES_USER: qtamp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qtamp_dev}
    # No host port published — reachable only from other containers on this
    # compose network (as `postgres:5432`). Anyone who can reach the host
    # would otherwise be able to hit the DB directly. For local debugging,
    # use `docker compose exec postgres psql ...` or a docker-compose.override.yml.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qtamp -d qtamp"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # No host port published — internal network only (as `redis:6379`), same
    # reasoning as postgres above.
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://qtamp:${POSTGRES_PASSWORD:-qtamp_dev}@postgres:5432/qtamp
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      UPLOAD_DIR: /app/uploads
      BACKUP_DIR: /app/backups
      PORT: 3001
      NODE_ENV: production
      TRUST_PROXY: "1"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      APP_URL: ${APP_URL:-http://localhost}
    volumes:
      - uploads:/app/uploads
      # Separate named volume from `uploads` — a backup on the same volume
      # as the live data doesn't survive that volume being lost. Point this
      # at a different physical disk/mount on the host where possible.
      - backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${EXPOSE_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads:
  backups:
