  <rect x="190" y="316" width="20" height="24" rx="4" fill="#d4a828" stroke="#a07818" stroke-width="1.5"/>
  <rect x="190" y="316" width="20" height="8"  rx="4" fill="#a07818"/>
  <circle cx="200" cy="342" r="3" fill="#7a5a10"/>
