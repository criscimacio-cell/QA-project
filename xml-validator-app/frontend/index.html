<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XML Validator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="container">
      <h1>XML Validator</h1>
      <p class="subtitle">Validate Claim, CF5, and ESOA XML documents</p>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <!-- Document Type Selector -->
      <div class="form-group">
        <label for="docType">Document Type</label>
        <select id="docType">
          <option value="claim">Claim</option>
          <option value="cf5">CF5</option>
          <option value="esoa">ESOA</option>
        </select>
      </div>

      <!-- Tab Buttons -->
      <div class="tabs" role="tablist">
        <button class="tab-btn active" role="tab" data-tab="paste" aria-selected="true">Paste XML</button>
        <button class="tab-btn" role="tab" data-tab="upload" aria-selected="false">Upload Files</button>
        <button class="tab-btn" role="tab" data-tab="folder" aria-selected="false">Upload Folder</button>
      </div>

      <!-- Paste Panel -->
      <div class="tab-panel active" id="panel-paste">
        <textarea
          id="xmlInput"
          placeholder="Paste your XML content here..."
          rows="12"
          spellcheck="false"
        ></textarea>
      </div>

      <!-- Upload Files Panel -->
      <div class="tab-panel" id="panel-upload">
        <div class="drop-zone" id="dropZone">
          <div class="drop-zone__icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </div>
          <p class="drop-zone__text">Drag &amp; drop XML files here</p>
          <p class="drop-zone__hint">or</p>
          <label class="btn-secondary" for="fileInput">Browse Files</label>
          <input type="file" id="fileInput" multiple accept=".xml" style="display:none" />
        </div>
        <div class="file-list" id="fileList"></div>
      </div>

      <!-- Upload Folder Panel -->
      <div class="tab-panel" id="panel-folder">
        <div class="drop-zone folder-zone">
          <div class="drop-zone__icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
          </div>
          <p class="drop-zone__text">Select a folder containing XML files</p>
          <p class="drop-zone__hint">All .xml files in the folder will be validated</p>
          <label class="btn-secondary" for="folderInput">Browse Folder</label>
          <input type="file" id="folderInput" webkitdirectory style="display:none" />
        </div>
        <div class="file-list" id="folderFileList"></div>
      </div>

      <!-- Validate Button -->
      <button id="validateBtn" class="btn-primary">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 11 12 14 22 4"/>
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
        </svg>
        Validate
      </button>
    </div>

    <!-- Loading Spinner -->
    <div class="loading" id="loading" style="display:none">
      <div class="spinner"></div>
      <p>Validating...</p>
    </div>

    <!-- Results Section -->
    <div class="results-section" id="resultsSection" style="display:none">
      <div class="summary-bar">
        <span class="summary-item summary-total">
          Total: <strong id="totalCount">0</strong>
        </span>
        <span class="summary-item summary-pass">
          Passed: <strong id="passCount">0</strong>
        </span>
        <span class="summary-item summary-fail">
          Failed: <strong id="failCount">0</strong>
        </span>
        <button id="downloadBtn" class="btn-download">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Download Report
        </button>
      </div>
      <div id="resultsContainer"></div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
