<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XML Validator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>XML Validator</h1>
      <p class="subtitle">Validate Claim, CF5, and ESOA XML documents instantly</p>
    </div>
  </header>

  <main class="container">
    <div class="card controls-card">

      <!-- Document Type Selector -->
      <div class="form-group">
        <label for="doc-type">Document Type</label>
        <select id="doc-type">
          <option value="claim">Claim</option>
          <option value="cf5">CF5</option>
          <option value="esoa">ESOA</option>
        </select>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab-btn active" data-tab="paste">Paste XML</button>
        <button class="tab-btn" data-tab="upload">Upload Files</button>
        <button class="tab-btn" data-tab="folder">Upload Folder</button>
      </div>

      <!-- Tab Panels -->
      <div class="tab-panels">

        <!-- Paste Panel -->
        <div class="tab-panel active" id="tab-paste">
          <textarea
            id="xmlInput"
            placeholder="Paste your XML content here..."
            spellcheck="false"
          ></textarea>
        </div>

        <!-- Upload Files Panel -->
        <div class="tab-panel" id="tab-upload">
          <div class="drop-zone" id="drop-zone">
            <div class="drop-zone-icon">&#128194;</div>
            <p class="drop-zone-text">Drag &amp; drop XML files here</p>
            <p class="drop-zone-sub">or click to browse</p>
            <input
              type="file"
              id="file-input"
              multiple
              accept=".xml"
              style="display:none"
            />
          </div>
          <div class="file-list" id="upload-file-list"></div>
        </div>

        <!-- Upload Folder Panel -->
        <div class="tab-panel" id="tab-folder">
          <div class="drop-zone" id="folder-zone">
            <div class="drop-zone-icon">&#128194;</div>
            <p class="drop-zone-text">Select a folder containing XML files</p>
            <p class="drop-zone-sub">All .xml files in the folder will be validated</p>
            <button class="btn-secondary" id="folder-btn">Choose Folder</button>
            <input
              type="file"
              id="folder-input"
              webkitdirectory
              style="display:none"
            />
          </div>
          <div class="file-list" id="folder-file-list"></div>
          <p id="folder-label" style="font-size:.85rem;color:var(--text-muted);margin-top:.5rem;"></p>
        </div>

      </div>

      <!-- Error message -->
      <p id="error-msg" style="color:var(--error);font-size:.875rem;min-height:1.2rem;margin-top:.25rem;"></p>

      <!-- Validate Button -->
      <div class="actions">
        <button class="btn-primary" id="validate-btn">Validate</button>
        <div class="spinner" id="spinner"></div>
      </div>
    </div>

    <!-- Results Section -->
    <div id="results-section">
      <div class="summary-bar">
        <div class="summary-stat">
          <div class="num" id="stat-total">0</div>
          <div class="lbl">Total</div>
        </div>
        <div class="summary-stat passed">
          <div class="num" id="stat-passed">0</div>
          <div class="lbl">Passed</div>
        </div>
        <div class="summary-stat failed">
          <div class="num" id="stat-failed">0</div>
          <div class="lbl">Failed</div>
        </div>
        <div style="flex:1"></div>
        <button class="btn-download" id="download-btn">Download Report (.xlsx)</button>
      </div>

      <div class="results-list" id="results-list"></div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
