<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XML Validator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div>
      <h1>⚙ XML Validator</h1>
      <div class="subtitle">Validate Claim, CF5, and ESOA documents</div>
    </div>
  </header>

  <main>
    <!-- Document Type -->
    <div class="card">
      <h2>1. Select Document Type</h2>
      <label for="doc-type">Document Type</label>
      <select id="doc-type">
        <option value="claim">Claim</option>
        <option value="cf5">CF5</option>
        <option value="esoa">ESOA</option>
      </select>
    </div>

    <!-- Input Methods -->
    <div class="card">
      <h2>2. Provide XML Input</h2>
      <div class="tabs">
        <button class="tab-btn active" data-tab="paste">Paste XML</button>
        <button class="tab-btn" data-tab="upload">Upload Files</button>
        <button class="tab-btn" data-tab="folder">Upload Folder</button>
      </div>

      <!-- Paste -->
      <div id="tab-paste" class="tab-panel active">
        <label for="xml-paste">Paste raw XML content below</label>
        <textarea id="xml-paste" placeholder="<Claim>&#10;  <ClaimID>CLM001</ClaimID>&#10;  ...&#10;</Claim>"></textarea>
      </div>

      <!-- File Upload -->
      <div id="tab-upload" class="tab-panel">
        <div class="drop-zone" id="drop-zone">
          <div class="icon">📂</div>
          <p>Drag &amp; drop XML files here</p>
          <small>or click to browse</small>
          <input type="file" id="file-input" accept=".xml" multiple hidden />
        </div>
        <div class="file-list" id="upload-file-list"></div>
      </div>

      <!-- Folder Upload -->
      <div id="tab-folder" class="tab-panel">
        <div class="folder-btn-wrap">
          <button class="btn-secondary" id="folder-btn">📁 Select Folder</button>
          <span id="folder-label" style="font-size:.875rem;color:var(--gray-600)">No folder selected</span>
          <input type="file" id="folder-input" webkitdirectory multiple hidden />
        </div>
        <div class="file-list" id="folder-file-list" style="margin-top:.75rem"></div>
      </div>
    </div>

    <!-- Actions -->
    <div class="card actions">
      <button class="btn-primary" id="validate-btn">Validate</button>
      <button class="btn-download" id="download-btn">⬇ Download Report (.xlsx)</button>
      <div class="spinner" id="spinner"></div>
      <span id="error-msg" style="color:var(--error);font-size:.875rem"></span>
    </div>

    <!-- Results -->
    <div id="results-section">
      <div class="card">
        <h2>Validation Summary</h2>
        <div class="summary-bar">
          <div class="summary-stat">
            <div class="num" id="stat-total">0</div>
            <div class="lbl">Total Files</div>
          </div>
          <div class="summary-stat passed">
            <div class="num" id="stat-passed">0</div>
            <div class="lbl">Passed</div>
          </div>
          <div class="summary-stat failed">
            <div class="num" id="stat-failed">0</div>
            <div class="lbl">Failed</div>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>File Results</h2>
        <div class="results-list" id="results-list"></div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
