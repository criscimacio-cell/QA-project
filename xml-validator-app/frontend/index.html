<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XML Validator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="header-inner">
      <h1>XML Validator</h1>
      <p class="subtitle">Validate Claim, CF5, and ESOA XML documents instantly</p>
    </div>
  </header>

  <main class="container">

    <div class="card controls-card">

      <!-- Document Type Selector -->
      <div class="form-group">
        <label for="docType">Document Type</label>
        <select id="docType">
          <option value="claim">Claim</option>
          <option value="cf5">CF5</option>
          <option value="esoa">ESOA</option>
        </select>
      </div>

      <!-- Tab buttons -->
      <div class="tabs">
        <button class="tab-btn active" data-tab="paste">Paste XML</button>
        <button class="tab-btn" data-tab="upload">Upload Files</button>
        <button class="tab-btn" data-tab="folder">Upload Folder</button>
      </div>

      <!-- Tab panels -->
      <div class="tab-panels">

        <!-- Paste panel -->
        <div class="tab-panel active" id="panel-paste">
          <textarea
            id="xmlInput"
            placeholder="Paste your XML content here..."
            spellcheck="false"
          ></textarea>
        </div>

        <!-- Upload Files panel -->
        <div class="tab-panel" id="panel-upload">
          <div class="drop-zone" id="dropZone">
            <div class="drop-zone-icon">&#128194;</div>
            <p class="drop-zone-text">Drag &amp; drop XML files here</p>
            <p class="drop-zone-sub">or click to browse</p>
            <input
              type="file"
              id="fileInput"
              multiple
              accept=".xml"
              style="display:none"
            />
          </div>
          <div class="file-list" id="fileList"></div>
        </div>

        <!-- Upload Folder panel -->
        <div class="tab-panel" id="panel-folder">
          <div class="drop-zone folder-zone" id="folderZone">
            <div class="drop-zone-icon">&#128193;</div>
            <p class="drop-zone-text">Select a folder containing XML files</p>
            <p class="drop-zone-sub">All .xml files in the folder will be validated</p>
            <input
              type="file"
              id="folderInput"
              webkitdirectory
              style="display:none"
            />
            <button class="btn-secondary" id="chooseFolderBtn">Choose Folder</button>
          </div>
          <div class="file-list" id="folderFileList"></div>
        </div>

      </div><!-- /.tab-panels -->

      <!-- Error message -->
      <p class="inline-error" id="errorMsg"></p>

      <!-- Validate button -->
      <button class="btn-primary" id="validateBtn">Validate</button>

    </div><!-- /.controls-card -->

    <!-- Loading spinner -->
    <div class="loading" id="loading" style="display:none">
      <div class="spinner"></div>
      <p>Validating&hellip;</p>
    </div>

    <!-- Results section -->
    <div class="results-section" id="resultsSection" style="display:none">

      <div class="summary-bar">
        <div class="summary-stat">
          <div class="stat-value" id="totalCount">0</div>
          <div class="stat-label">Total</div>
        </div>
        <div class="summary-stat success">
          <div class="stat-value" id="passCount">0</div>
          <div class="stat-label">Passed</div>
        </div>
        <div class="summary-stat danger">
          <div class="stat-value" id="failCount">0</div>
          <div class="stat-label">Failed</div>
        </div>
        <div class="summary-actions">
          <button class="btn-download" id="downloadBtn">
            &#11123; Download Report (.xlsx)
          </button>
        </div>
      </div>

      <div class="results-container" id="resultsContainer"></div>

    </div><!-- /#resultsSection -->

  </main>

  <script src="app.js"></script>
</body>
</html>
