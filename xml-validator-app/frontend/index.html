<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XML Validator — PhilHealth</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── Header ── -->
  <header>
    <div class="header-inner">
      <div class="header-brand">
        <div class="header-logo">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <polyline points="9 15 12 18 15 15"/>
            <line x1="12" y1="11" x2="12" y2="18"/>
          </svg>
        </div>
        <div>
          <h1>XML Validator</h1>
          <p class="subtitle">Claim &middot; CF4 &middot; CF5 &middot; ESOA</p>
        </div>
      </div>
    </div>
  </header>

  <main class="container">

    <!-- ── Input Card ── -->
    <div class="card">

      <!-- Doc Type -->
      <div class="section-label">Document Type</div>
      <div class="doc-type-group" id="docTypeGroup">
        <button class="doc-btn active" data-value="claim">Claim</button>
        <button class="doc-btn" data-value="cf4">CF4</button>
        <button class="doc-btn" data-value="cf5">CF5</button>
        <button class="doc-btn" data-value="esoa">ESOA</button>
      </div>
      <!-- Hidden select kept for JS compatibility -->
      <select id="docType" style="display:none">
        <option value="claim">Claim</option>
        <option value="cf4">CF4</option>
        <option value="cf5">CF5</option>
        <option value="esoa">ESOA</option>
      </select>

      <div class="divider"></div>

      <!-- Input Tabs -->
      <div class="tabs" role="tablist">
        <button class="tab-btn active" role="tab" data-tab="paste" aria-selected="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
          Paste XML
        </button>
        <button class="tab-btn" role="tab" data-tab="upload" aria-selected="false">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          Upload Files
        </button>
        <button class="tab-btn" role="tab" data-tab="folder" aria-selected="false">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
          Upload Folder
        </button>
      </div>

      <!-- Paste Panel -->
      <div class="tab-panel active" id="panel-paste">
        <textarea
          id="xmlInput"
          placeholder="Paste your XML content here…"
          rows="12"
          spellcheck="false"
        ></textarea>
      </div>

      <!-- Upload Files Panel -->
      <div class="tab-panel" id="panel-upload">
        <div class="drop-zone" id="dropZone">
          <div class="drop-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="1.5"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </div>
          <p class="drop-title">Drag &amp; drop XML files here</p>
          <p class="drop-sub">or click to browse</p>
          <label class="btn-secondary" for="fileInput">Browse Files</label>
          <input type="file" id="fileInput" multiple accept=".xml" style="display:none" />
        </div>
        <div class="file-list" id="fileList"></div>
      </div>

      <!-- Upload Folder Panel -->
      <div class="tab-panel" id="panel-folder">
        <div class="drop-zone folder-zone">
          <div class="drop-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="1.5"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
          </div>
          <p class="drop-title">Select a folder of XML files</p>
          <p class="drop-sub">All .xml files inside will be validated</p>
          <button class="btn-secondary" id="chooseFolderBtn">Browse Folder</button>
          <input type="file" id="folderInput" webkitdirectory style="display:none" />
        </div>
        <div class="file-list" id="folderFileList"></div>
      </div>

      <!-- Error message -->
      <p id="errorMsg" class="inline-error"></p>

      <!-- Action Buttons -->
      <div class="action-row">
        <button id="validateBtn" class="btn-primary">
          <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 11 12 14 22 4"/>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
          </svg>
          Validate
        </button>
        <button id="clearBtn" class="btn-clear">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
          Clear
        </button>
      </div>

    </div><!-- /.card -->

    <!-- ── Loading ── -->
    <div class="loading" id="loading" style="display:none">
      <div class="spinner"></div>
      <span>Validating files…</span>
    </div>

    <!-- ── Results ── -->
    <div class="results-section" id="resultsSection" style="display:none">

      <!-- Summary Bar -->
      <div class="summary-bar">
        <div class="stat-block">
          <span class="stat-value" id="totalCount">0</span>
          <span class="stat-label">Total</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-block success">
          <span class="stat-value" id="passCount">0</span>
          <span class="stat-label">Passed</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-block danger">
          <span class="stat-value" id="failCount">0</span>
          <span class="stat-label">Failed</span>
        </div>
        <div class="summary-actions">
          <button id="downloadBtn" class="btn-download">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            Download Report
          </button>
        </div>
      </div>

      <!-- Result Cards -->
      <div id="resultsContainer"></div>

    </div><!-- /.results-section -->

  </main>

  <script src="app.js"></script>

  <!-- Doc-type pill button wiring (UI only — syncs to hidden select) -->
  <script>
    document.querySelectorAll(".doc-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".doc-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("docType").value = btn.dataset.value;
      });
    });
  </script>

</body>
</html>
