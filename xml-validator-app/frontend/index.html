<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XML Validator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <div class="container">
      <h1 class="site-title">XML Validator</h1>
      <p class="site-subtitle">Validate Claim, CF5, and ESOA XML documents instantly</p>
    </div>
  </header>

  <main class="container">

    <!-- Document Type -->
    <div class="card">
      <label class="field-label" for="docType">Document Type</label>
      <select id="docType" class="select-input">
        <option value="claim">Claim</option>
        <option value="cf5">CF5</option>
        <option value="esoa">ESOA</option>
      </select>
    </div>

    <!-- Input Tabs -->
    <div class="card">
      <div class="tab-bar" role="tablist">
        <button class="tab-btn active" data-tab="paste" role="tab" aria-selected="true">Paste XML</button>
        <button class="tab-btn" data-tab="upload" role="tab" aria-selected="false">Upload Files</button>
        <button class="tab-btn" data-tab="folder" role="tab" aria-selected="false">Upload Folder</button>
      </div>

      <!-- Paste Panel -->
      <div id="panel-paste" class="tab-panel active">
        <textarea
          id="xmlInput"
          class="xml-textarea"
          placeholder="Paste your XML content here…"
          spellcheck="false"
        ></textarea>
      </div>

      <!-- Upload Files Panel -->
      <div id="panel-upload" class="tab-panel hidden">
        <div
          id="dropZone"
          class="drop-zone"
          role="region"
          aria-label="File drop zone"
        >
          <div class="drop-zone__icon">📂</div>
          <p class="drop-zone__text">Drag &amp; drop <strong>.xml</strong> files here</p>
          <p class="drop-zone__hint">or</p>
          <label class="btn btn--outline" for="fileInput">Browse Files</label>
          <input
            id="fileInput"
            type="file"
            accept=".xml"
            multiple
            class="visually-hidden"
          />
        </div>
        <div id="fileList" class="file-list"></div>
      </div>

      <!-- Upload Folder Panel -->
      <div id="panel-folder" class="tab-panel hidden">
        <div class="drop-zone drop-zone--folder">
          <div class="drop-zone__icon">🗂️</div>
          <p class="drop-zone__text">Select a folder containing <strong>.xml</strong> files</p>
          <label class="btn btn--outline" for="folderInput">Choose Folder</label>
          <input
            id="folderInput"
            type="file"
            webkitdirectory
            class="visually-hidden"
          />
        </div>
        <div id="folderFileList" class="file-list"></div>
      </div>
    </div>

    <!-- Validate Button -->
    <button id="validateBtn" class="btn btn--primary btn--full">
      Validate
    </button>

    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="spinner-wrap hidden" aria-live="polite">
      <div class="spinner"></div>
      <span>Validating…</span>
    </div>

    <!-- Results Section -->
    <section id="resultsSection" class="hidden" aria-live="polite">
      <div class="summary-bar">
        <div class="summary-stat summary-stat--total">
          <span class="summary-count" id="totalCount">0</span>
          <span class="summary-label">Total</span>
        </div>
        <div class="summary-stat summary-stat--pass">
          <span class="summary-count" id="passCount">0</span>
          <span class="summary-label">Passed</span>
        </div>
        <div class="summary-stat summary-stat--fail">
          <span class="summary-count" id="failCount">0</span>
          <span class="summary-label">Failed</span>
        </div>
      </div>

      <div id="resultsContainer"></div>

      <button id="downloadBtn" class="btn btn--secondary btn--full">
        ⬇ Download Excel Report
      </button>
    </section>

    <!-- Error Banner -->
    <div id="errorBanner" class="error-banner hidden" role="alert"></div>

  </main>

  <script src="app.js"></script>
</body>
</html>
